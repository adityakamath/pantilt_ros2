# ros2_control controller manager settings and JointStateBroadcaster for the standalone pan-tilt.
# The position controller's own parameters are in pantilt_controller.yaml (loaded by the spawner) and
# the joint limits come from the URDF, so a host robot can reuse both without merging this file.
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    statistics_publish_rate: 0.0
    enforce_command_limits: true
    handle_exceptions: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


joint_state_broadcaster:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - tilt_joint
    # No `interfaces` needed: JSB publishes position/velocity/effort to /joint_states
    # and extra state interfaces (voltage, temperature, etc.) to /dynamic_joint_states.

