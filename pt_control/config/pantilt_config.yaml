# Controller manager and joint state broadcaster; the position controller is in pantilt_controller.yaml.
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    statistics_publish_rate: 0.0
    enforce_command_limits: true
    handle_exceptions: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    state_interfaces_broadcaster:
      type: state_interfaces_broadcaster/StateInterfacesBroadcaster


joint_state_broadcaster:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - tilt_joint
    # No `interfaces` needed: JSB publishes position/velocity/effort to /joint_states.

# Extra motor data (voltage, temperature, current, moving flag) for motor_diagnostics_node, published
# to /state_interfaces_broadcaster/values; spawned on real hardware only (MuJoCo has no such interfaces).
state_interfaces_broadcaster:
  ros__parameters:
    interfaces:
      - shoulder_pan_joint/effort
      - shoulder_pan_joint/voltage
      - shoulder_pan_joint/temperature
      - shoulder_pan_joint/current
      - shoulder_pan_joint/is_moving
      - tilt_joint/effort
      - tilt_joint/voltage
      - tilt_joint/temperature
      - tilt_joint/current
      - tilt_joint/is_moving

