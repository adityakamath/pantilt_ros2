# mujoco_ros2_control_plugins config - only used when ros2_control_hardware_type:="mujoco"
# (pt_control/launch/pantilt.launch.py passes this to mujoco_ros2_control's ros2_control_node
# via ParameterFile).
#
# CameraPlugin publishes the oak_rgb <camera> (pt_mujoco/mjcf/oakd_s2_subtree.xml) as
# RGB-D + camera_info. Topic names match the real depthai_ros_driver's topics exactly
# (see README ROS Interfaces table: /oak/rgb/image_raw, /oak/stereo/image_raw) so downstream
# consumers don't need to know whether they're talking to real or simulated camera.
# camera_publish_rate matches the real RGB pipeline's 30 Hz (pt_bringup/config/oakd_vio.yaml).
/**:
  ros__parameters:
    mujoco_plugins:
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 30.0
        oak_rgb:
          frame_name: oak_link
          info_topic: /oak/rgb/camera_info
          image_topic: /oak/rgb/image_raw
          depth_topic: /oak/stereo/image_raw
