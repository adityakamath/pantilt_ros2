serial_port: /dev/ttySERVO
baud_rate: 1000000

use_mock: false
use_sync_write: true

sts3215_max_vel_steps: 3400
proportional_vel_max: 0

# Servo EEPROM profile (0-254, no physical units); 65/50/0 is slow and smooth, also read by host robots
internal_max_vel: 65
internal_max_acc: 50
internal_acc_coeff: 0

# Motor IDs, centres and joint limits live in pantilt.joints.xacro's macro defaults
