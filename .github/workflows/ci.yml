name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  build:
    name: colcon build (ros:kilted)
    # Builds the packages and runs the pytest suites (URDF, MuJoCo models, launch arguments)
    runs-on: ubuntu-latest
    container: ros:kilted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/pantilt_ros2

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip python3-pytest \
            ros-kilted-controller-manager \
            ros-kilted-forward-command-controller \
            ros-kilted-joint-state-broadcaster \
            ros-kilted-joy-teleop \
            ros-kilted-robot-state-publisher \
            ros-kilted-ros2-control \
            ros-kilted-xacro

      - name: colcon build
        # pt_bringup is excluded: cloudini, point_cloud_interfaces and depthai-ros are not plain apt packages
        run: |
          . /opt/ros/kilted/setup.sh
          colcon build --packages-select pt_description pt_mujoco pt_control

      - name: xacro sanity check
        run: |
          . /opt/ros/kilted/setup.sh
          . install/setup.sh
          xacro src/pantilt_ros2/pt_description/urdf/pantilt.urdf.xacro > /dev/null

      - name: pytest
        # pt_bringup is not built here (see above) but its launch file is only parsed, not started.
        run: |
          . /opt/ros/kilted/setup.sh
          . install/setup.sh
          pip install --break-system-packages -r src/pantilt_ros2/pt_mujoco/requirements.txt
          pytest src/pantilt_ros2/pt_description/test src/pantilt_ros2/pt_control/test src/pantilt_ros2/pt_mujoco/test

  mujoco:
    name: MuJoCo models and viewer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulation dependencies
        run: pip install -e ./pt_mujoco "pytest<8"
      - name: Validate generated models, dynamics and URDF geometry
        run: pytest pt_mujoco/test -q
