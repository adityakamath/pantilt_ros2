/oak:
  ros__parameters:
    driver:
      i_usb_speed: SUPER
      i_enable_ir: false
    pipeline_gen:
      i_nn_type: none
      i_pipeline_type: RGBD
      i_enable_imu: true
      i_enable_vio: false  # LeKiwi Nav2 uses base odometry, not the OAK VIO stream
    vio:
      i_fps: 30.0
      i_publish_tf: false
    rgb:
      i_fps: 15.0
      i_width: 640
      i_height: 400
      i_low_bandwidth: true
      i_low_bandwidth_quality: 50
      i_publish_topic: true
    imu:
      i_acc_freq: 100
      i_gyro_freq: 100
      i_max_batch_reports: 10
      i_batch_report_threshold: 1
      i_enable_rotation: false
      i_sync_method: LINEAR_INTERPOLATE_ACCEL
    left:
      i_publish_topic: false
    right:
      i_publish_topic: false
    stereo:
      i_fps: 15.0
      i_depth_preset: FAST_ACCURACY
      i_publish_topic: true
      i_publish_left_rect: false
      i_publish_right_rect: false
      i_publish_synced_rect_pair: false
      i_aligned: false
      i_enable_threshold_filter: true
      i_threshold_filter_min_range: 450
      i_threshold_filter_max_range: 4000
      i_enable_decimation_filter: false
      i_decimation_filter_decimation_mode: PIXEL_SKIPPING
      i_decimation_filter_decimation_factor: 2
    oak.rgb.image_raw.enable_pub_plugins:
      - image_transport/raw
      - image_transport/compressed
    oak.stereo.image_raw.enable_pub_plugins:
      - image_transport/raw
