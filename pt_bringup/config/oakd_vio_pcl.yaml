# Overlay on oakd_vio.yaml when pointcloud:=true; holds only the keys that differ
/oak:
  ros__parameters:
    pipeline_gen:
      i_enable_rgbd: true  # generates /oak/rgbd/points
    rgb:
      # Pinned: a smaller RGB size crashes this profile with i_aligned/i_enable_rgbd
      i_width: 640
      i_height: 400
    stereo:
      i_aligned: true  # depth aligned to RGB, so point cloud colors line up with geometry
      # Pinned: decimation crashes this profile with i_aligned/i_enable_rgbd
      i_enable_decimation_filter: false
      i_fps: 30.0  # must match rgb's rate or depth/scan/rgbd silently stop publishing

# Cloudini compression of /oak/rgbd/points at 1 mm resolution
/cloudini_compressor:
  ros__parameters:
    compressing: true
    topic_input: "/oak/rgbd/points"
    topic_output: "/oak/rgbd/points/compressed"
    resolution: 0.001  # 1mm (recommended), 0.01 for visualization, 0.0001 for paranoid mode
